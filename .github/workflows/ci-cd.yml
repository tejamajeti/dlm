name: Frontend CI/CD Pipeline

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: frontend-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/dlm-frontend

jobs:
  build-and-publish:
    name: Build, Test and Publish Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # 1. Checkout repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js 20
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install exact dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. CI Validation & Type Check Build
      - name: Compile & Build Frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # 5. Set up QEMU (Commented out for fast single-arch Railway builds; uncomment if deploying to ARM64 VPS)
      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v3

      # 6. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 7. Authenticate to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 8. Build and push Docker image to GHCR (Fast Single-Arch linux/amd64 for Railway)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 9. Prune old / untagged Docker image versions from GHCR
      - name: Prune Old GHCR Image Versions
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          token: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          package-name: 'dlm-frontend'
          package-type: 'container'
          min-versions-to-keep: 5
          delete-only-untagged-versions: 'false'


